# Every pull request: style and the Core test suite, on the same toolchain as the release job.
# Also every push to main: a PR can only restore its own caches and main's, so without a run on main
# every new PR's first run compiled Core from scratch.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the run for its previous commit pointless, so that run is stopped. On main each
# push keeps its own run, so the newest cache is always saved.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Silences git's "Using 'master' as the name for the initial branch" hint: actions/checkout runs `git init`
# before any step could set it.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # A PR that changes only Markdown skips `check` and `unused`: skipped by `if` counts as success for a required
  # check, where a paths filter would leave it pending. Main always runs in full (DECISIONS: Release builds main's
  # newest green commit). A diff that fails counts as code: a failed job here would skip both too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git fetch -q --depth=1 origin "$BASE" && git diff --name-only "$BASE" HEAD) || files="(diff failed)"
            echo "Changed files: $files"
            grep -qv '\.md$' <<< "$files" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Most of the Test Core step was compiling from scratch. Swift compares file contents, not just
      # dates, so a restored build skips unchanged files even after a fresh checkout. Main's cache serves every
      # new PR, a PR's own cache its later runs; the key changes with the Xcode build so a toolchain update
      # starts clean.
      - name: Restore the Core build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Core/.build
          key: core-build-${{ runner.os }}-xcode27.0-${{ github.sha }}
          restore-keys: core-build-${{ runner.os }}-xcode27.0-

      - name: Install SwiftLint and XcodeGen
        run: brew install swiftlint xcodegen

      - name: Lint
        run: scripts/lint.sh

      - name: Check release versioning
        run: scripts/test-next-version.sh

      - name: Check the SideStore source
        run: scripts/test-sidestore-source.sh

      - name: Test Core
        run: swift test --package-path Core

      # The IPA is built only after merge, so a Release-only compile error (a #Preview outside #if DEBUG)
      # would pass this check. Same signing flags as scripts/build-ipa.sh.
      - name: Build the Release app
        run: |
          xcodegen generate
          xcodebuild build -project Thumbmix.xcodeproj -scheme Thumbmix -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # Beside `check`, not after it: `swiftlint analyze` is single-threaded and has no faster mode, and as `check`'s
  # last step it was the longest (2.5-5.5 min, 2026-10-20), so a PR waited for it after everything else had passed.
  unused:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint and XcodeGen
        run: brew install swiftlint xcodegen

      # xcodebuild finds no runtime for the image's watch simulators and asserts per device (DVTAssertions "SimDevice
      # native architecture is nil", 25-55 times here), while simctl calls them available. The app is iPhone only.
      - name: Delete the watch simulators
        run: |
          xcrun simctl list runtimes
          for device in $(xcrun simctl list -j devices | jq -r '.devices | to_entries[] | select(.key | contains("watchOS")) | .value[].udid'); do
            xcrun simctl delete "$device"
          done
          xcrun simctl list devices watchOS

      # scripts/unused.sh builds the project but doesn't generate it.
      - name: Find unused code
        run: |
          xcodegen generate
          scripts/unused.sh
