# Every pull request: style and the Core test suite, on the same toolchain as the release job.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: scripts/lint.sh

      - name: Test Core
        run: swift test --package-path Core
