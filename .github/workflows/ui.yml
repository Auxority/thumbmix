# The full UI suite, once a week on main (2026-10-26, the user): agents run it on the Mac before a PR (CLAUDE.md);
# this catches what slips past that. One simulator clone: on this runner (3 M1 cores, 7 GB) it took ~19 min and
# passed, two clones took 30 min and starved the app. A failed run mails whoever last edited this schedule.
name: UI suite

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after unused code
  workflow_dispatch:

permissions:
  contents: read

# Silences git's "Using 'master' as the name for the initial branch" hint: actions/checkout runs `git init`
# before any step could set it.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  ui:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      UI_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      # Same as unused.yml: xcodebuild asserts per watch simulator, which has no runtime it can use.
      - name: Delete the watch simulators
        run: |
          for device in $(xcrun simctl list -j devices | jq -r '.devices | to_entries[] | select(.key | contains("watchOS")) | .value[].udid'); do
            xcrun simctl delete "$device"
          done

      # The image has no iPhone SE, the phone the suite is written for (375 pt wide); Xcode 27.0 runs iOS 27.0.
      - name: Create the iPhone SE simulator
        run: |
          runtime=$(xcrun simctl list -j runtimes | jq -r '.runtimes[] | select(.name == "iOS 27.0") | .identifier')
          xcrun simctl create "iPhone SE (3rd generation)" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime"

      - name: Run the UI suite
        run: scripts/ui-test.sh

      - name: Keep a failed run's evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failed
          path: |
            build/ui-test.log
            build/ui-test-failed
          if-no-files-found: ignore
