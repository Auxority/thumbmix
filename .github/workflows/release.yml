# Every push to main (including a merged PR) becomes a GitHub Release with an unsigned IPA for SideStore.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases must not race each other: build numbers and tags are created in run order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Lint and tests are not repeated here: main only takes PRs whose CI `check` passed on an up-to-date branch
    # (branch protection, admins included). A manual run from another branch would skip that gate, so refuse it.
    if: github.ref == 'refs/heads/main'
    # Same Xcode build (27.0, 27A266a) as the development Mac, so CI compiles what the local tests proved.
    # `xcode-27` is a GitHub preview image (runner-images#14404); fall back to `macos-26` (Xcode 26.6) if it misbehaves.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: scripts/build-ipa.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 'MARKETING_VERSION:' project.yml | awk -F'"' '{print $2}')
          test -n "$version" || { echo "MARKETING_VERSION not found in project.yml" >&2; exit 1; }
          tag="v${version}-${BUILD_NUMBER}"
          gh release create "$tag" build/ipa/Thumbmix.ipa \
            --target "$GITHUB_SHA" \
            --title "Thumbmix ${version} (build ${BUILD_NUMBER})" \
            --generate-notes
