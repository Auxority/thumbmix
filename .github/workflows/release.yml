# A push to main (a merged PR) with a feat or fix commit becomes a GitHub Release with an unsigned IPA for
# SideStore, versioned from the commit titles (scripts/next-version.sh), once CI (`check` and `unused`) passed
# on that commit. A manual run releases a version you type, such as 1.0.0 or 1.0.0-rc.1. Everything below
# 1.0.0, and every -rc, is marked as a pre-release. Every run builds main's newest commit that passed CI; a
# manual run refuses to start until that is main's latest commit.
name: Release

on:
  # After CI on main, not on the push itself: a PR may merge without main's latest commits (branch protection
  # doesn't require an up-to-date branch), so two PRs that only break together must turn main red, not ship.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 or 1.0.0-rc.1 (empty: from the commit titles)"
        required: false

permissions:
  contents: write
  actions: read # to find main's newest commit that passed CI

# Releases must not race each other: build numbers and tags are created in run order. Waiting runs can be
# cancelled, which is why each run builds the newest green commit (scripts/release-commit.sh).
concurrency:
  group: release
  cancel-in-progress: false

# Silences git's "Using 'master' as the name for the initial branch" hint: actions/checkout runs `git init`
# before any step could set it.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  release:
    # Lint and tests are not repeated here: only a commit whose CI passed on main's push is built. A manual run
    # from another branch would run that branch's copy of this workflow, so refuse it.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    # Same Xcode build (27.0, 27A266a) as the development Mac, so CI compiles what the local tests proved.
    # `xcode-27` is a GitHub preview image (runner-images#14404); fall back to `macos-26` (Xcode 26.6) if it misbehaves.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and commits since the last release decide the version

      - name: Check out the newest green commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(scripts/release-commit.sh)
          git checkout --quiet --detach "$sha"
          echo "Building $sha"

      - name: Decide the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(scripts/release-version.sh "$REQUESTED")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: ${version:-none (no feat or fix since the last release)}"

      - name: Show toolchain
        if: steps.version.outputs.version != ''
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        if: steps.version.outputs.version != ''
        run: brew install xcodegen

      # The runner image ships watch simulators without their runtime; xcodebuild asserts once per device for each
      # (DVTAssertions "SimDevice native architecture is nil"), 25 times in an archive.
      - name: Delete simulators without a runtime
        if: steps.version.outputs.version != ''
        run: |
          xcrun simctl list devices unavailable
          xcrun simctl delete unavailable

      - name: Build unsigned IPA
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-ipa.sh

      - name: Publish release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/publish-release.sh

      # SideStore reads its source from a raw link on the `sidestore` branch and offers the new version on its own.
      - name: Publish the SideStore source
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-sidestore-source.sh
