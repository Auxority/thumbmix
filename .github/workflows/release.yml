# A push to main (a merged PR) with a feat or fix commit becomes a GitHub Release with an unsigned IPA for
# SideStore, versioned from the commit titles (scripts/next-version.sh). A manual run releases a version you
# type, such as 1.0.0 or 1.0.0-rc.1. Everything below 1.0.0, and every -rc, is marked as a pre-release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 or 1.0.0-rc.1 (empty: from the commit titles)"
        required: false

permissions:
  contents: write

# Releases must not race each other: build numbers and tags are created in run order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Lint and tests are not repeated here: main only takes PRs whose CI `check` passed on an up-to-date branch
    # (branch protection, admins included). A manual run from another branch would skip that gate, so refuse it.
    if: github.ref == 'refs/heads/main'
    # Same Xcode build (27.0, 27A266a) as the development Mac, so CI compiles what the local tests proved.
    # `xcode-27` is a GitHub preview image (runner-images#14404); fall back to `macos-26` (Xcode 26.6) if it misbehaves.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and commits since the last release decide the version

      - name: Decide the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(scripts/release-version.sh "$REQUESTED")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: ${version:-none (no feat or fix since the last release)}"

      - name: Show toolchain
        if: steps.version.outputs.version != ''
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        if: steps.version.outputs.version != ''
        run: brew install xcodegen

      - name: Build unsigned IPA
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-ipa.sh

      - name: Publish release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in 0.* | *-*) prerelease=(--prerelease) ;; esac
          gh release create "v${VERSION}" build/ipa/Thumbmix.ipa \
            --target "$GITHUB_SHA" \
            --title "Thumbmix ${VERSION} (build ${BUILD_NUMBER})" \
            --generate-notes \
            ${prerelease[@]+"${prerelease[@]}"}
