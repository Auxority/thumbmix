# A trial (2026-10-26): how long the full UI suite takes on GitHub's free xcode-27 runner (3 M1 cores, 7 GB),
# with 1 and with 2 simulator clones, and whether it holds. Runs on pushes to its own branch and by hand;
# nothing on pull requests until that's decided.
name: UI suite trial

on:
  push:
    branches: [ci/ui-suite-trial]
  workflow_dispatch:

permissions:
  contents: read

# Silences git's "Using 'master' as the name for the initial branch" hint: actions/checkout runs `git init`
# before any step could set it.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      UI_TEST_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      # Same as unused.yml: xcodebuild asserts per watch simulator, which has no runtime it can use.
      - name: Delete the watch simulators
        run: |
          for device in $(xcrun simctl list -j devices | jq -r '.devices | to_entries[] | select(.key | contains("watchOS")) | .value[].udid'); do
            xcrun simctl delete "$device"
          done

      # The image has no iPhone SE, the phone the suite is written for (375 pt wide); Xcode 27.0 runs iOS 27.0.
      - name: Create the iPhone SE simulator
        run: |
          runtime=$(xcrun simctl list -j runtimes | jq -r '.runtimes[] | select(.name == "iOS 27.0") | .identifier')
          xcrun simctl create "iPhone SE (3rd generation)" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime"
          xcrun simctl list devices "iPhone SE"

      - name: Run the UI suite
        run: |
          started=$(date +%s)
          status=0
          scripts/ui-test.sh || status=$?
          echo "The UI suite took $(( $(date +%s) - started )) s on ${UI_TEST_WORKERS} clone(s), exit $status."
          exit "$status"

      - name: Keep a failed run's evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failed-${{ matrix.workers }}
          path: |
            build/ui-test.log
            build/ui-test-failed
          if-no-files-found: ignore
