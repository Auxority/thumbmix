name: Feature request
description: Something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what stops you today?
      description: Describe the moment it matters, e.g. soundcheck or mid-show.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: today
    attributes:
      label: How do you do it now?
      description: On the desk, in another app, or not at all.
