name: Thumbmix
options:
  bundleIdPrefix: dev.thumbmix
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ThumbmixCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # No target has App Intents, so the extraction step only warned "Metadata extraction skipped, no
    # AppIntents.framework dependency found". Drop this once the app adds an intent.
    LM_SKIP_METADATA_EXTRACTION: YES
targets:
  Thumbmix:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ThumbmixCore
        product: ThumbmixCore
      # Offline mode runs the fake console inside the app, so every screen can be tried without a desk.
      - package: ThumbmixCore
        product: FakeM32
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Thumbmix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Thumbmix talks to your M32 over the local network.
        UILaunchScreen: {}
        # Only Debug builds handle it (AppModel.openTestURL): UI tests switch the running app to a new fake desk.
        CFBundleURLTypes: [{CFBundleURLName: dev.thumbmix.app.uitest, CFBundleURLSchemes: [thumbmix-test]}]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thumbmix.app
        # iPhone only (iPads run it as an iPhone app): xcodegen's iOS app default of iPhone + iPad overrode the
        # project's "1", and a portrait-only iPad app needs UIRequiresFullScreen, deprecated since iOS 26.
        TARGETED_DEVICE_FAMILY: "1"
        # One 1024 px icon (App/Assets.xcassets), rendered from Design/AppIcon.svg by scripts/render-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local builds only: the release workflow sets the version from the commit titles
        # (scripts/release-version.sh) and the build number from the run number.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [ThumbmixUITests]
  ThumbmixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Thumbmix
      # Each test runs its own fake desk inside the test runner (UITests/TestDesk.swift).
      - package: ThumbmixCore
        product: ThumbmixCore
      - package: ThumbmixCore
        product: FakeM32
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.thumbmix.uitests
